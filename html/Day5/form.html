<html>
    <head><title>form</title></head>
    <body>
        <center>
            <h1>Form</h1>
            <br>
            <form>
                <label for="name">Enter your name</label>
                <input id="name" type="text" placeholder="Start with cap letter" required/>
                <br>
                <label for="mobile">Enter your phone number</label>
                <input id="mobile" type="tel" maxlength="10" />
                <br>
                <label for="date">Date of birth</label>
                <input type="date" name="" id="date"/ required>
                <br>
                <label for="age">Enter your Age</label>
                <input type="number" min="18" required>
                <br>
                <label for="city">choose your City</label>
                <select name="" id="city">
                    <option value="" selected disabled >select here</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Bengalore">Bengalore</option>
                </select>
                <br>
                <label for="address">Enter your Address</label>
                <textarea name="" id="address" cols="15" rows="6"></textarea>
                <br>
                <input type="submit" value="register">
            </form>
        </center>
    </body>
</html>
