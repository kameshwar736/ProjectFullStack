    <main>
        <center>
            <section>
                <h1>STUDENT FEEDBACK FORM</h1>
                <table>
                    <thead>
                        <th></th>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Name</td>
                            <td><input type="text" placeholder="Start with Cap" required></td>
                        </tr>
                        <tr>
                            <td>
                                Email ID
                            </td>
                            <td>
                                <input type="email" required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                Phone No
                            </td>
                            <td>
                                <input type="number" max=10 required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                Qualification
                            </td>
                            <td>
                                <select required>
                                    <option disabled selected> Choose here</option>
                                    <option value="UnderGraduate"> UnderGraduate</option>
                                    <option value="PostGraduate">PostGraduate</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                College
                            </td>
                            <td>
                                <input type="text" required placeholder="Enter your College Name">
                            </td>
                        </tr>
                        <tr>
                            <td>City</td>
                            <td><input type="text" required></td>

                        </tr>
                        <tr>
                            <td>State</td>
                            <td><input type="text" required></td>
                        </tr>
                        <tr>
                            <td>
                                FEEDBACK
                            </td>
                            <td>
                                <textarea name="" id="" cols="30" rows="10"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="button" value="Submit"> <input type="reset"
                                    value="Submit another response">
                            </td>
                        </tr>


                    </tbody>
