<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch</title>


    <style>
        .head {
            display: flex;
            justify-content: center;
            color: gray;
        }


        .parent {
            background-color: rgb(197, 171, 171);
            padding: 10px;
            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 15px;

            
        }
    </style>
</head>

<body style="background-color: black;">
    <h1 class="head">Fetch API using - to showing the Product Cards</h1>
    <div  id = "dom" style="display: grid; grid-template-columns: repeat(3,1fr); place-items: center; gap: 30px;">

        <div>
        <div class="parent">
            <div>
                <img src="../../html/Day4/pic/logo.png" alt="" style="width: 250px; border-radius: 20px;">
                <h3>Product</h3>
            </div>
            <div>
                <div style="display: flex; background-color: gray; width: 270px; justify-content: space-between;align-items: center;">
                    <p>$1000</p>
                    <button style="width: 100px;height: 40px; border-radius: 20px;">Buy</button>
                </div>
            </div>
        </div>
    </div>

    </div>

</body>








<script>


    const searchData = async () => {

        let getData = await fetch("https://dummyjson.com/products");
        let stringData = await getData.json()
        let finalProduct = stringData.products
        let dom = document.getElementById("dom")
        dom.innerHTML=""

        finalProduct.forEach((value,index) => {

            let newStyle = 
            `
            <div id="dom">
                    <div class="parent">
                        <div>
                             <img src="${value.images}" alt="" style="width: 250px; border-radius: 20px;">
                            <h3>${value.title}</h3>
                        </div>
                        <div>
                            <div style="display: flex; background-color: gray; width: 270px; justify-content: space-between;align-items: center; padding : 7px">
                                <p>${value.price}</p>
                                  <button style="width: 100px;height: 40px; border-radius: 20px;">Buy</button>
                            </div>
                        </div>
                    </div>
                </div>




            `

            
                dom.innerHTML += newStyle
            
            
            
        });
        
        
          
    


        

       
    }
    searchData()


</script>

</html>
