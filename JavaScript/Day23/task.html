<script>
    // Simple Callback Execution

    let sumFunction =()=>{
       
        console.log("hello world")
        return
    }

    let callFunc =()=>{
       
        
        return

    }

    callFunc(sumFunction())

    // Add Using Callback


    let addFunc1 =(a,b)=>{
         
         return a+b
    }

    let addFunction = (call) => {
        
        return call
    }

    console.log(addFunction(addFunc1(1,2)));
    

    // Multiply Using Callback


    let multiFunc = (a,b)=>{
        return a*b
    }

    let callMultiply =(multiply)=>{
        return multiply
    }
    
    console.log(callMultiply(multiFunc(3,4)));

    // Even Check Callback

    let evenNum = (a)=>{
        
        return a
    }

    let evenCheck =(even)=>{
        if(even%2==0){
            console.log("even:" ,even);
            
        }
        else{
            console.log("odd");
            
        }
    }
    
    evenCheck(evenNum(2))
   
    // Greeting Callback


    let nameFunc = (name)=>{
        return name
    }

    let greetName = (greet)=>{
        console.log(greet)
    }

    greetName(nameFunc(" Greeting Callback"))


   // closure function

   //Simple Counter


   let increValue = ()=>{
    let a=0
    let innerFunc =()=>{
        a++
        console.log(a);
        
    }
   return innerFunc
    
   }

   let call = increValue()

   call()
   call()

  // Message Closure

  const msgFunc =()=>{
    console.log("this is the message");
    
  }

  setTimeout(msgFunc,1000)

  console.log("Wait the mwssage is loading");
  

  // User Login Closure

  let userOuter =()=>{
    let name = "JavaScript"
    let user =()=>{
        console.log("User",name,"Logged In");
        return
        
    }
    user()
  }

  userOuter()


  


   
    
</script>
