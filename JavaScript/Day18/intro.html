<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
</head>
<body>


    view on console
    

    <script>

        //var identifier
        var productName="pen"
        console.log(productName)
        var ProductPrice = 10;
        console.log(ProductPrice)
        var pen_type="Refill"
        console.log(pen_type)

        //let identifier
        let firstName="Kamesh"
        console.log(firstName)
        let LastName="T"
        console.log(LastName)
        let phone_number=88074
        console.log(phone_number)

        //const identifier
        const pinCode=60001
        console.log(pinCode)
        const Home_location="Chennai"
        console.log(Home_location)
        const office_name="accenture"
        console.log(office_name)




    </script>
</body>
</html>
