<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign_In</title>
</head>
<body>

    <div>
        <form action="">
            <input type="email"  placeholder="Enter the Email" id="mailSignin">
            <input type="password" placeholder="Enter the password"  id="passSignin">
            <button id="btnSignin"><a href="" id="link">Sign In</a></button>
        </form>
    </div>
    





    <script>


        let btnSignin = document.getElementById("btnSignin")        
        btnSignin.addEventListener("click",()=>{

            let mailSignin = document.getElementById("mailSignin").value;
            let passSignin = document.getElementById("passSignin").value;
            let link = document.getElementById("link")

            let checkData = JSON.parse(localStorage.getItem("ecomRegister"))
            

            if(checkData.find(check => check.mail == mailSignin && check.pass == passSignin)){
                alert("Success")
                link.href = "../Day31/fetch.html"
                 
            }else{
                alert("failed")
            }

           


        })

        




    </script>
</body>
</html>
