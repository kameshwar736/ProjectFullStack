<script>
    //print 1 to 10

    for (let a = 1; a <= 10; a++) {
        console.log(a)
    }

    //print reverse 1 to 10

    for (let a = 10; a >= 1; a--) {
        console.log(a)
    }

    //print even num

    for (a = 1; a <= 20; a++) {
        if (a % 2 == 0) {
            console.log(`Even Number : ${a}`);
        }
    }

    //print odd number

    for(let a = 1;a<=20;a++){
        if(a%2!=0){
            console.log(`Odd number : ${a}`);

            
        }
    }

    // table
   
    for(let a = 1;a<=10;a++){
        console.log(`5 * ${a} = ${a * 5}`)
    }

    // count number

    let count = 0
    for(let a = 1; a<=50; a++ ){
        count++
    }
    console.log(count);

    // square number

    for(let a = 1 ; a <=10 ;a++){
        let square = a*a
        console.log(`square value  ${a} : ${square}`);
        
        
    }

    //star pattern

    for(let a = 5;a>=1;a--){
        console.log("*")
        
    }

    //no divisible by 3 

    for(let a = 1 ;a<=30;a++){
        if(a%3==0){
            console.log(`divisible by 3 : ${a}`);
            
        }
    }
    

    // sum of no from 1 to 10
    let sum = 0
    for (let a = 0;a<=10;a++){
        sum += a
    }
    console.log(`sum value ${sum}`);
    
    </script>
